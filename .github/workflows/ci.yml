# WP-12: minimal CI — unit tests on 3.10/3.11/3.12, hygiene lint, version check.
# (QGIS-container smoke tests are planned separately, see WP-11.)
name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # requests: download manager iteration tests (HTTP server)
      # rasterio: GeoTIFF write fallback used by windthrow e2e
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest h5py numpy
          requests rasterio
      - name: Unit tests (nisar_core, no QGIS needed)
        run: python -m pytest tests/unit -v
      - name: Relative-import sanity check
        run: python scripts_import_check.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Never-imported / undefined-name check (F-rules)
        run: python -m ruff check nisar_qgis tests --select=F

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest
      - name: metadata.txt <-> __init__.py <-> build script
        run: |-
          python -m pytest tests/unit/test_version_consistency.py -v
          python scripts_build_zip.py
